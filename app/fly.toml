app = "chufarm-app"
primary_region = "sin"

[build]
  [build.args]
    VITE_API = "https://chufarm-api.fly.dev"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
